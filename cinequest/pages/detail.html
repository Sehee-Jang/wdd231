<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineQuest</title>
    <link rel="stylesheet" href="/cinequest/css/base.css" />
    <link rel="stylesheet" href="/cinequest/css/style.css" />
    <link rel="stylesheet" href="/cinequest/css/detail.css" />
    <link rel="icon" href="/cinequest/assets/favicon.ico" />
  </head>
  <body>
    <!-- Header -->
    <header class="header ty3">
      <div class="top">
        <h1 class="logo"><a href="/cinequest/index.html">CineQuest</a></h1>

        <!-- Search Bar -->
        <form role="search" class="search">
          <input
            type="text"
            placeholder="Search for a movie..."
            title="Search Movie"
            class="input_text"
            id="search_input"
          />
          <button class="search_button" id="search_button">
            <i class="iconset ico_search"></i> Search
          </button>
        </form>
      </div>

      <!-- Navigation -->
      <div id="nav">
        <ul id="navMenu">
          <li class="">
            <a href="/cinequest/pages/upcoming.html">Upcoming</a>
          </li>
          <li class="">
            <a href="/cinequest/pages/popular.html">Popular</a>
          </li>
          <li class="">
            <a href="/cinequest/pages/top.html">Top Rated</a>
          </li>
          <li class="">
            <a href="/cinequest/pages/nowplaying.html">Now Playing</a>
          </li>

          <li class="wrap_nav_underline">
            <span class="nav_underline"></span>
          </li>
        </ul>
      </div>
    </header>

    <!-- Main -->
    <main>
      <div class="detaillWrap">
        <!-- Movie Details -->
      </div>
    </main>

    <!-- Top Button -->
    <button id="top-btn" onclick="toTop()">▲<br />Top</button>

    <!-- Footer -->
    <footer>
      <p>
        &copy; 2024 CineQuest |
        <a href="/cinequest/pages/attribution.html">Attributions</a>
      </p>
    </footer>

    <!-- Script -->
    <script src="js/top.js"></script>
    <script src="js/toggle.js"></script>
    <script type="module" src="js/detail.js"></script>
  </body>
</html>
